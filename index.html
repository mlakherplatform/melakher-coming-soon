<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="تجربة جديدة في عالم الرخام — م الآخر، كل حاجة أسهل."
    >

    <meta
        name="theme-color"
        content="#0b0c0d"
    >

    <title>م الآخر | تجربة جديدة في عالم الرخام</title>


    <style>

        /* =====================================================
           ROOT
        ===================================================== */

        :root {

            --background: #090a0b;

            --surface: #101214;

            --text: #f4f1ec;

            --muted: #a7a5a1;

            --accent: #b52a34;

            --accent-light: #d45a61;

            --stone: #777873;

            --border: rgba(255, 255, 255, 0.09);

        }


        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            min-height: 100%;
        }


        body {

            min-height: 100vh;

            color: var(--text);

            font-family:
                "Cairo",
                "Noto Sans Arabic",
                Arial,
                sans-serif;

            background:

                radial-gradient(
                    circle at 50% 5%,
                    rgba(181, 42, 52, 0.12),
                    transparent 32%
                ),

                radial-gradient(
                    circle at 10% 90%,
                    rgba(255, 255, 255, 0.035),
                    transparent 28%
                ),

                var(--background);

            overflow: hidden;

        }


        /* =====================================================
           MARBLE-LIKE TEXTURE
        ===================================================== */

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            pointer-events: none;

            opacity: 0.035;

            background-image:

                linear-gradient(
                    115deg,
                    transparent 0%,
                    rgba(255,255,255,.5) 45%,
                    transparent 47%,
                    transparent 100%
                );

            background-size: 520px 520px;

            transform: rotate(-8deg);

        }


        /* =====================================================
           AMBIENT LIGHT
        ===================================================== */

        .ambient {

            position: fixed;

            width: 500px;

            height: 500px;

            top: -260px;

            left: 50%;

            transform: translateX(-50%);

            border-radius: 50%;

            background:
                rgba(181, 42, 52, 0.13);

            filter: blur(110px);

            pointer-events: none;

        }


        /* =====================================================
           PAGE
        ===================================================== */

        .page {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px;

        }


        .container {

            width: 100%;

            max-width: 900px;

            text-align: center;

        }


        /* =====================================================
           TOP
        ===================================================== */

        .top {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 55px;

            opacity: 0;

            animation:
                fadeDown
                1s
                ease
                forwards;

        }


        .brand {

            font-size: 14px;

            font-weight: 700;

            color: rgba(255,255,255,.65);

        }


        .coming {

            display: flex;

            align-items: center;

            gap: 9px;

            color: rgba(255,255,255,.45);

            font-size: 12px;

        }


        .dot {

            width: 7px;

            height: 7px;

            border-radius: 50%;

            background: var(--accent);

            box-shadow:
                0 0 0 5px
                rgba(181,42,52,.10);

        }


        /* =====================================================
           HERO
        ===================================================== */

        .hero {

            position: relative;

            padding:
                clamp(55px, 9vw, 95px)
                clamp(20px, 6vw, 80px);

            border:

                1px solid
                var(--border);

            border-radius: 38px;

            background:

                linear-gradient(
                    145deg,
                    rgba(255,255,255,.055),
                    rgba(255,255,255,.012)
                );

            box-shadow:

                0 35px 100px
                rgba(0,0,0,.42),

                inset 0 1px 0
                rgba(255,255,255,.045);

            backdrop-filter: blur(18px);

            overflow: hidden;

            opacity: 0;

            animation:
                fadeUp
                1.1s
                .15s
                ease
                forwards;

        }


        /* =====================================================
           HERO LIGHT
        ===================================================== */

        .hero::before {

            content: "";

            position: absolute;

            width: 420px;

            height: 420px;

            top: -260px;

            left: 50%;

            transform:
                translateX(-50%);

            border-radius: 50%;

            background:
                rgba(181,42,52,.08);

            filter: blur(80px);

        }


        /* =====================================================
           LOGO
        ===================================================== */

        .logo-wrapper {

            position: relative;

            display: flex;

            justify-content: center;

            align-items: center;

            margin-bottom: 42px;

        }


        .logo {

            width:
                min(280px, 65vw);

            max-height: 160px;

            object-fit: contain;

            filter:

                drop-shadow(
                    0 18px 35px
                    rgba(0,0,0,.35)
                );

        }


        /* =====================================================
           SMALL LABEL
        ===================================================== */

        .label {

            display: inline-flex;

            align-items: center;

            gap: 9px;

            padding:
                8px 17px;

            margin-bottom: 27px;

            border-radius: 999px;

            border:
                1px solid
                rgba(181,42,52,.22);

            background:
                rgba(181,42,52,.075);

            color:
                var(--accent-light);

            font-size: 12px;

            font-weight: 700;

        }


        /* =====================================================
           TITLE
        ===================================================== */

        h1 {

            font-size:
                clamp(
                    36px,
                    7vw,
                    68px
                );

            line-height: 1.25;

            letter-spacing:
                -2px;

            font-weight: 800;

            margin-bottom: 18px;

        }


        h1 span {

            color:
                var(--accent-light);

        }


        /* =====================================================
           TAGLINE
        ===================================================== */

        .tagline {

            font-size:
                clamp(
                    19px,
                    4vw,
                    27px
                );

            font-weight: 600;

            color:
                rgba(255,255,255,.88);

        }


        .tagline strong {

            color:
                var(--accent-light);

            font-weight: 800;

        }


        /* =====================================================
           DIVIDER
        ===================================================== */

        .divider {

            width: 70px;

            height: 2px;

            margin:
                38px auto 0;

            background:

                linear-gradient(
                    90deg,
                    transparent,
                    var(--accent),
                    transparent
                );

        }


        /* =====================================================
           FOOTER
        ===================================================== */

        footer {

            margin-top: 27px;

            color:
                rgba(255,255,255,.25);

            font-size: 11px;

            opacity: 0;

            animation:
                fadeUp
                1s
                .45s
                ease
                forwards;

        }


        /* =====================================================
           ANIMATIONS
        ===================================================== */

        @keyframes fadeUp {

            from {

                opacity: 0;

                transform:
                    translateY(18px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        @keyframes fadeDown {

            from {

                opacity: 0;

                transform:
                    translateY(-12px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            .page {

                padding:
                    16px;

            }


            .top {

                margin-bottom:
                    25px;

            }


            .hero {

                border-radius:
                    27px;

                padding:
                    55px 20px;

            }


            .logo {

                width:
                    200px;

            }


            h1 {

                letter-spacing:
                    -1.5px;

            }


            .tagline {

                line-height:
                    1.7;

            }

        }


    </style>

</head>


<body>


    <div class="ambient"></div>


    <div class="page">


        <div class="container">


            <!-- TOP BAR -->

            <header class="top">

                <div class="brand">

                    م الآخر

                </div>


                <div class="coming">

                    <span class="dot"></span>

                    قريبًا

                </div>

            </header>



            <!-- HERO -->

            <main class="hero">


                <!-- LOGO -->

                <div class="logo-wrapper">

                    <img
                        src="assets/logo.png"
                        alt="م الآخر"
                        class="logo"
                    >

                </div>



                <!-- LABEL -->

                <div class="label">

                    تجربة جديدة

                </div>



                <!-- MAIN MESSAGE -->

                <h1>

                    تجربة جديدة في
                    <span>عالم الرخام</span>

                </h1>



                <!-- BRAND MESSAGE -->

                <div class="tagline">

                    م الآخر — <strong>كل حاجة أسهل.</strong>

                </div>



                <!-- DIVIDER -->

                <div class="divider"></div>


            </main>



            <!-- FOOTER -->

            <footer>

                © 2026 م الآخر

            </footer>


        </div>

    </div>


</body>

</html>
