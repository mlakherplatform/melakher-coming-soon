<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="م الآخر — كل حاجة أبسط.">

    <title>م الآخر | قريبًا</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                "Cairo",
                "Noto Sans Arabic",
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(179, 38, 46, 0.08),
                    transparent 38%
                ),
                #f7f7f5;

            color: #171717;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 680px;

            text-align: center;
        }

        .card {
            padding: 70px 30px;

            border-radius: 30px;

            background: rgba(255, 255, 255, 0.78);

            border: 1px solid rgba(0, 0, 0, 0.07);

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.08);

            backdrop-filter: blur(14px);
        }

        .logo {
            width: 220px;
            max-width: 65%;

            max-height: 140px;

            object-fit: contain;

            display: block;

            margin: 0 auto 30px;
        }

        .badge {
            display: inline-block;

            padding: 7px 16px;

            border-radius: 50px;

            background: rgba(179, 38, 46, 0.09);

            color: #b3262e;

            font-size: 13px;

            font-weight: 700;

            margin-bottom: 18px;
        }

        h1 {
            margin: 0;

            font-size: clamp(38px, 8vw, 58px);

            line-height: 1.15;

            letter-spacing: -2px;
        }

        p {
            margin: 20px auto 0;

            max-width: 500px;

            color: #777;

            font-size: clamp(15px, 3.5vw, 18px);

            line-height: 2;
        }

        .line {
            width: 55px;

            height: 3px;

            background: #b3262e;

            border-radius: 20px;

            margin: 30px auto 0;
        }

        footer {
            margin-top: 20px;

            color: #aaa;

            font-size: 12px;
        }

        @media (max-width: 600px) {

            .card {
                padding: 50px 22px;
            }

            .logo {
                width: 180px;
            }

            h1 {
                font-size: 40px;
            }

        }

    </style>

</head>


<body>

    <main class="container">

        <section class="card">

            <!-- Logo -->
            <img
                src="assets/logo.png"
                alt="م الآخر"
                class="logo"
            >

            <!-- Status -->
            <div class="badge">
                قريبًا
            </div>

            <!-- Main Title -->
            <h1>
                كل حاجة أبسط.
            </h1>

            <!-- Description -->
            <p>
                بنجهّز حاجة جديدة تخلي الوصول
                للحاجة اللي محتاجها أسهل وأسرع وأوضح.
            </p>

            <div class="line"></div>

        </section>

        <footer>
            © م الآخر
        </footer>

    </main>

</body>

</html>
