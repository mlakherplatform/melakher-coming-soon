<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#F3F1EC"
    >

    <meta
        name="description"
        content="م الآخر — تجربة جديدة في عالم الرخام. كل حاجة أسهل."
    >

    <title>
        م الآخر | تجربة جديدة في عالم الرخام
    </title>


    <style>

        /* =====================================================
           COLORS
        ===================================================== */

        :root {

            --background: #F3F1EC;

            --surface: #FAF9F6;

            --surface-soft: #F7F5F1;

            --text: #202020;

            --muted: #77736D;

            --accent: #A92D35;

            --accent-soft: #C05A60;

            --border: #DEDAD2;

            --stone: #B8B4AC;

        }


        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            min-height: 100%;
        }


        body {

            min-height: 100vh;

            font-family:
                "Cairo",
                "Noto Sans Arabic",
                Arial,
                sans-serif;

            color: var(--text);

            background: var(--background);

            overflow: hidden;

            position: relative;

        }


        /* =====================================================
           MARBLE BACKGROUND
        ===================================================== */

        body::before {

            content: "";

            position: fixed;

            inset: -20%;

            pointer-events: none;

            opacity: .38;

            background:

                radial-gradient(
                    ellipse at 20% 30%,
                    rgba(255,255,255,.95),
                    transparent 35%
                ),

                radial-gradient(
                    ellipse at 80% 70%,
                    rgba(220,216,207,.65),
                    transparent 38%
                );

            filter: blur(35px);

            z-index: -2;

        }


        /* =====================================================
           SUBTLE MARBLE VEINS
        ===================================================== */

        body::after {

            content: "";

            position: fixed;

            inset: -100px;

            pointer-events: none;

            opacity: .13;

            background:

                linear-gradient(
                    112deg,
                    transparent 20%,
                    rgba(120,116,108,.22) 20.3%,
                    transparent 20.7%
                ),

                linear-gradient(
                    68deg,
                    transparent 45%,
                    rgba(120,116,108,.16) 45.2%,
                    transparent 45.5%
                ),

                linear-gradient(
                    130deg,
                    transparent 72%,
                    rgba(120,116,108,.14) 72.3%,
                    transparent 72.6%
                );

            background-size:
                700px 600px,
                850px 700px,
                900px 800px;

            transform: rotate(-5deg);

            z-index: -1;

        }


        /* =====================================================
           PAGE
        ===================================================== */

        .page {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px;

        }


        .container {

            width: 100%;

            max-width: 960px;

            text-align: center;

        }


        /* =====================================================
           TOP BAR
        ===================================================== */

        .topbar {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 38px;

            animation:
                fadeDown
                .9s
                ease
                both;

        }


        .brand {

            font-size: 15px;

            font-weight: 800;

            color: var(--text);

        }


        .status {

            display: flex;

            align-items: center;

            gap: 8px;

            font-size: 12px;

            color: var(--muted);

        }


        .status-dot {

            width: 7px;

            height: 7px;

            border-radius: 50%;

            background: var(--accent);

            box-shadow:
                0 0 0 5px
                rgba(169,45,53,.08);

        }


        /* =====================================================
           HERO
        ===================================================== */

        .hero {

            position: relative;

            padding:
                clamp(60px, 9vw, 95px)
                clamp(25px, 7vw, 90px);

            background:
                rgba(250,249,246,.82);

            border:
                1px solid
                rgba(190,185,176,.55);

            border-radius: 34px;

            box-shadow:

                0 25px 70px
                rgba(70,65,58,.10),

                inset 0 1px 0
                rgba(255,255,255,.9);

            backdrop-filter:
                blur(12px);

            overflow: hidden;

            animation:
                fadeUp
                1s
                .1s
                ease
                both;

        }


        /* =====================================================
           TOP ACCENT
        ===================================================== */

        .hero::before {

            content: "";

            position: absolute;

            top: 0;

            left: 50%;

            transform:
                translateX(-50%);

            width: 150px;

            height: 3px;

            background:
                var(--accent);

            border-radius:
                0 0 10px 10px;

        }


        /* =====================================================
           SOFT LIGHT
        ===================================================== */

        .hero::after {

            content: "";

            position: absolute;

            width: 420px;

            height: 420px;

            top: -300px;

            left: 50%;

            transform:
                translateX(-50%);

            border-radius: 50%;

            background:
                rgba(169,45,53,.055);

            filter:
                blur(70px);

            pointer-events:
                none;

        }


        /* =====================================================
           LOGO
        ===================================================== */

        .logo-wrapper {

            position: relative;

            display: flex;

            justify-content: center;

            align-items: center;

            margin-bottom: 42px;

        }


        .logo {

            width:
                min(285px, 65vw);

            max-height:
                165px;

            object-fit:
                contain;

            display:
                block;

            filter:
                drop-shadow(
                    0 12px 22px
                    rgba(0,0,0,.08)
                );

        }


        /* =====================================================
           MAIN TITLE
        ===================================================== */

        h1 {

            font-size:
                clamp(
                    34px,
                    6vw,
                    62px
                );

            line-height:
                1.35;

            letter-spacing:
                -1.8px;

            font-weight:
                800;

            color:
                var(--text);

            margin-bottom:
                20px;

        }


        h1 span {

            color:
                var(--accent);

        }


        /* =====================================================
           TAGLINE
        ===================================================== */

        .tagline {

            font-size:
                clamp(
                    19px,
                    3.5vw,
                    27px
                );

            line-height:
                1.7;

            font-weight:
                600;

            color:
                #3E3B37;

        }


        .tagline strong {

            color:
                var(--accent);

            font-weight:
                800;

        }


        /* =====================================================
           DIVIDER
        ===================================================== */

        .divider {

            width:
                58px;

            height:
                2px;

            margin:
                35px auto 0;

            border-radius:
                20px;

            background:
                var(--accent);

        }


        /* =====================================================
           FOOTER
        ===================================================== */

        footer {

            margin-top:
                24px;

            color:
                rgba(32,32,32,.38);

            font-size:
                11px;

            animation:
                fadeUp
                1s
                .4s
                ease
                both;

        }


        /* =====================================================
           ANIMATIONS
        ===================================================== */

        @keyframes fadeUp {

            from {

                opacity: 0;

                transform:
                    translateY(18px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        @keyframes fadeDown {

            from {

                opacity: 0;

                transform:
                    translateY(-12px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            body {
                overflow: auto;
            }


            .page {

                min-height:
                    100vh;

                padding:
                    18px 14px;

            }


            .topbar {

                margin-bottom:
                    22px;

            }


            .brand {

                font-size:
                    14px;

            }


            .hero {

                padding:
                    55px 20px
                    48px;

                border-radius:
                    27px;

            }


            .logo {

                width:
                    205px;

                max-height:
                    120px;

            }


            .logo-wrapper {

                margin-bottom:
                    35px;

            }


            h1 {

                font-size:
                    36px;

                letter-spacing:
                    -1px;

                line-height:
                    1.4;

            }


            .tagline {

                font-size:
                    19px;

            }


            footer {

                margin-top:
                    18px;

            }

        }


    </style>

</head>


<body>


    <div class="page">


        <div class="container">


            <!-- ============================================
                 TOP BAR
            ============================================= -->

            <header class="topbar">


                <div class="brand">

                    م الآخر

                </div>


                <div class="status">

                    <span class="status-dot"></span>

                    قريبًا

                </div>


            </header>



            <!-- ============================================
                 HERO
            ============================================= -->

            <main class="hero">


                <!-- LOGO -->

                <div class="logo-wrapper">

                    <img
                        src="assets/logo.png"
                        alt="م الآخر"
                        class="logo"
                    >

                </div>



                <!-- MAIN MESSAGE -->

                <h1>

                    تجربة جديدة في
                    <span>عالم الرخام</span>

                </h1>



                <!-- BRAND TAGLINE -->

                <div class="tagline">

                    م الآخر — <strong>كل حاجة أسهل.</strong>

                </div>



                <!-- DIVIDER -->

                <div class="divider"></div>


            </main>



            <!-- ============================================
                 FOOTER
            ============================================= -->

            <footer>

                © 2026 م الآخر

            </footer>


        </div>

    </div>


</body>

</html>
